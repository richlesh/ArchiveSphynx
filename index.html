<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ArchiveSphynx</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar">
    <button id="btn-new" title="New Archive">&#128196; New</button>
    <button id="btn-open" title="Open Archive">&#128194; Open</button>
    <button id="btn-save" title="Save Archive" disabled>&#128190; Save</button>
    <button id="btn-saveas" title="Save As..." disabled>&#128190; Save As…</button>
    <div class="toolbar-sep"></div>
    <button id="btn-add" title="Add Files" disabled><span class="btn-icon">+</span> Add</button>
    <button id="btn-folder" title="New Folder" disabled>&#128193; New Folder</button>
    <button id="btn-delete" title="Delete Selected" disabled>&#128465; Delete</button>
    <div class="toolbar-sep"></div>
    <button id="btn-extract" title="Extract" disabled>&#128229; Extract All</button>
    <div class="toolbar-sep"></div>
    <button id="btn-test" title="Test Integrity" disabled>&#9989; Test</button>
    <div class="toolbar-sep"></div>
    <button id="btn-clean" title="Clean macOS" disabled>&#128736; Clean macOS</button>
  </div>

  <div id="path-bar"><span id="archive-path">No archive open</span><span id="progress" style="display:none;margin-left:12px;"><span id="progress-label"></span> <progress id="progress-bar" value="0" max="100" style="width:120px;vertical-align:middle;"></progress><span id="progress-track"><span class="slider"></span></span> <span id="progress-count"></span></span></div>

  <div id="tree-container">
    <table id="tree-table">
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="tree-body"></tbody>
    </table>
  </div>

  <div id="status-bar">
    <span id="status-files">0 files</span>
    <span id="status-size">0 bytes</span>
  </div>

  <script>
    const { ipcRenderer, webUtils } = require("electron");
    const path = require("path");
    const fs = require("fs");
    const { createArchive, detectFormat, setZstdPath, setBzip2Path, setGzipPath, setXzPath, setSevenZipPath, isZstdAvailable, isZstdCliAvailable, wasBzip2FallbackUsed } = require("./archive");

    function getSaveFilters() {
      const filters = [
        { name: "ZIP Archive", extensions: ["zip"] },
        { name: "7z Archive", extensions: ["7z"] },
        { name: "JAR Archive", extensions: ["jar"] },
        { name: "TAR Archive", extensions: ["tar"] },
        { name: "Compressed TAR (gzip)", extensions: ["tgz"] },
        { name: "Compressed TAR (bzip2)", extensions: ["tbz2"] },
        { name: "Compressed TAR (xz)", extensions: ["txz"] },
      ];
      if (isZstdCliAvailable()) filters.push({ name: "Compressed TAR (zstd)", extensions: ["tzst"] });
      filters.push({ name: "Compressed TAR (7z)", extensions: ["t7z"] });
      return filters;
    }

    function getOpenFilters() {
      const exts = ["zip", "7z", "rar", "jar", "deb", "rpm", "dmg", "iso", "tar", "tar.gz", "tgz", "tar.bz2", "tbz2", "tar.xz", "txz", "tar.7z", "t7z"];
      const tarExts = ["tar", "tar.gz", "tgz", "tar.bz2", "tbz2", "tar.xz", "txz", "tar.7z", "t7z"];
      if (isZstdAvailable()) { exts.push("tar.zst", "tzst"); tarExts.push("tar.zst", "tzst"); }
      return [
        { name: "All Archives", extensions: exts },
        { name: "ZIP Archives", extensions: ["zip"] },
        { name: "7z Archives", extensions: ["7z"] },
        { name: "RAR Archives", extensions: ["rar"] },
        { name: "JAR Archives", extensions: ["jar"] },
        { name: "Disk Images", extensions: ["dmg", "iso"] },
        { name: "Packages", extensions: ["deb", "rpm"] },
        { name: "TAR Archives", extensions: tarExts },
      ];
    }

    const COLUMNS = [
      { id: "name", label: "Name", getter: (e) => e.entryName },
      { id: "modified", label: "Modified", getter: (e) => e.time ? new Date(e.time).toLocaleString() : "" },
      { id: "size", label: "Size", getter: (e) => e.isDirectory ? "" : formatBytes(e.size || 0) },
      { id: "compressed", label: "Compressed", getter: (e) => e.isDirectory ? "" : (e._pending ? "---" : (e.compressedSize < 0 ? "---" : formatBytes(e.compressedSize || 0))) },
      { id: "attributes", label: "Attributes", getter: (e) => formatAttr(e.attr) },
      { id: "type", label: "Type", getter: (e) => e.isDirectory ? "Folder" : extType(e.entryName) },
      { id: "method", label: "Method", getter: (e) => e.isDirectory ? "" : (e.method || "") },
    ];

    let columnOrder = COLUMNS.map((c) => c.id);
    let columnWidths = {};
    let archive = null;
    let archivePath = "";
    let sortCol = "name";
    let sortAsc = true;
    let selectedPaths = new Set();
    let lastClickedIdx = -1;
    let collapsedPaths = new Set();
    let dirty = false;

    function collapseAll() {
      collapsedPaths.clear();
      archive.getEntries().filter((e) => e.isDirectory).forEach((e) => collapsedPaths.add(e.entryName));
    }

    function isReadOnly() {
      return archive && ["rar", "deb", "rpm", "dmg", "iso"].includes(archive.format);
    }

    function setDirty(val) {
      dirty = val;
      const title = archivePath ? path.basename(archivePath) : "ArchiveSphynx";
      document.title = dirty ? "● " + title : title;
      ipcRenderer.invoke("set-dirty", dirty);
    }

    function formatBytes(b) {
      if (b === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB"];
      const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), units.length - 1);
      return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + units[i];
    }

    function formatAttr(attr) {
      if (!attr) return "";
      const a = attr >>> 16;
      if (a === 0) return "";
      const r = (a & 0o444) ? "r" : "-";
      const w = (a & 0o222) ? "w" : "-";
      const x = (a & 0o111) ? "x" : "-";
      return r + w + x;
    }

    function extType(name) {
      const ext = path.extname(name).toLowerCase();
      if (!ext) return "File";
      return ext.slice(1).toUpperCase() + " File";
    }

    async function saveZip() {
      await archive.save(archivePath, updateProgress, updateProgressLabel);
    }

    function refreshZip() {
      archive.refresh();
    }

    // Load column order from settings
    async function loadColumnOrder() {
      const { settings } = await ipcRenderer.invoke("settings-get-data");
      if (settings.columnOrder && Array.isArray(settings.columnOrder)) {
        const valid = settings.columnOrder.filter((id) => COLUMNS.find((c) => c.id === id));
        if (valid.length === COLUMNS.length) columnOrder = valid;
      }
      if (settings.columnWidths) columnWidths = settings.columnWidths;
      if (settings.zstdPath) setZstdPath(settings.zstdPath);
      if (settings.bzip2Path) setBzip2Path(settings.bzip2Path);
      if (settings.gzipPath) setGzipPath(settings.gzipPath);
      if (settings.xzPath) setXzPath(settings.xzPath);
      if (settings.sevenZipPath) setSevenZipPath(settings.sevenZipPath);
      applyColors(settings);
    }

    function applyColors(settings) {
      const sel = settings.selectionColor || "#0000FF";
      const btn = settings.buttonColor || "#0000FF";
      document.documentElement.style.setProperty("--selection-color", sel);
      document.documentElement.style.setProperty("--button-hover", btn);
    }

    async function saveColumnOrder() {
      const { settings } = await ipcRenderer.invoke("settings-get-data");
      await ipcRenderer.invoke("settings-save", { ...settings, columnOrder, columnWidths });
    }

    // Build header
    function buildHeader() {
      const row = document.getElementById("header-row");
      row.innerHTML = "";
      const tableWidth = document.getElementById("tree-table").offsetWidth;
      columnOrder.forEach((colId) => {
        const col = COLUMNS.find((c) => c.id === colId);
        const th = document.createElement("th");
        th.textContent = col.label + (sortCol === colId ? (sortAsc ? " ▲" : " ▼") : "");
        th.dataset.col = colId;
        th.draggable = true;
        if (columnWidths[colId]) th.style.width = columnWidths[colId] + "%";
        th.addEventListener("click", (e) => {
          if (e.target.classList.contains("col-resize")) return;
          if (colId === "attributes") return;
          if (sortCol === colId) sortAsc = !sortAsc;
          else { sortCol = colId; sortAsc = true; }
          render();
        });
        th.addEventListener("dragstart", (e) => {
          if (e.target.classList.contains("col-resize")) { e.preventDefault(); return; }
          e.dataTransfer.setData("text/plain", colId);
        });
        th.addEventListener("dragover", (e) => e.preventDefault());
        th.addEventListener("drop", (e) => {
          e.preventDefault();
          const from = e.dataTransfer.getData("text/plain");
          const to = colId;
          if (from === to) return;
          const fromIdx = columnOrder.indexOf(from);
          const toIdx = columnOrder.indexOf(to);
          columnOrder.splice(fromIdx, 1);
          columnOrder.splice(toIdx, 0, from);
          saveColumnOrder();
          render();
        });
        // Resize handle
        const handle = document.createElement("span");
        handle.className = "col-resize";
        handle.addEventListener("mousedown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const startX = e.clientX;
          const startW = th.offsetWidth;
          const onMove = (ev) => {
            const newW = Math.max(40, startW + ev.clientX - startX);
            const pct = (newW / tableWidth) * 100;
            th.style.width = pct + "%";
            columnWidths[colId] = Math.round(pct * 100) / 100;
          };
          const onUp = () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            saveColumnOrder();
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
        th.appendChild(handle);
        row.appendChild(th);
      });
    }

    function getEntries() {
      if (!archive) return [];
      return archive.getEntries();
    }

    function sortEntries(entries) {
      const col = COLUMNS.find((c) => c.id === sortCol);
      if (!col) return entries;
      return [...entries].sort((a, b) => {
        let va, vb;
        if (sortCol === "size" || sortCol === "compressed") {
          va = a.isDirectory ? -1 : (a.header?.[sortCol === "size" ? "size" : "compressedSize"] || 0);
          vb = b.isDirectory ? -1 : (b.header?.[sortCol === "size" ? "size" : "compressedSize"] || 0);
        } else if (sortCol === "modified") {
          va = a.header?.time ? new Date(a.header.time).getTime() : 0;
          vb = b.header?.time ? new Date(b.header.time).getTime() : 0;
        } else if (sortCol === "name") {
          va = path.basename(a.entryName.replace(/\/$/, "")).toLowerCase();
          vb = path.basename(b.entryName.replace(/\/$/, "")).toLowerCase();
        } else {
          va = String(col.getter(a)).toLowerCase();
          vb = String(col.getter(b)).toLowerCase();
        }
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });
    }

    function getParent(entryName) {
      const trimmed = entryName.replace(/\/$/, "");
      const idx = trimmed.lastIndexOf("/");
      return idx < 0 ? "" : trimmed.slice(0, idx + 1);
    }

    async function pruneEmptyDirs() {
      const entries = archive.getEntries();
      const hasChildren = new Set();
      for (const e of entries) {
        const parts = e.entryName.replace(/\/$/, "").split("/");
        for (let i = 1; i < parts.length; i++) {
          hasChildren.add(parts.slice(0, i).join("/") + "/");
        }
      }
      const toDelete = entries.filter((e) => e.isDirectory && !hasChildren.has(e.entryName));
      for (const e of toDelete) archive.deleteFile(e.entryName);
    }

    function buildVisibleList() {
      if (!archive) return [];
      const entries = archive.getEntries();
      // Add pending files as synthetic entries
      const pendingEntries = pendingFiles.map((pf) => ({
        entryName: pf.entryName,
        isDirectory: pf.isDirectory,
        size: pf.size || 0,
        compressedSize: 0,
        time: null,
        attr: 0,
        method: "",
        _pending: true,
      }));
      const allEntries = entries.concat(pendingEntries);
      // Ensure implicit parent directories exist in the children map
      const children = new Map();
      const knownDirs = new Set(allEntries.filter((e) => e.isDirectory).map((e) => e.entryName));
      allEntries.forEach((e) => {
        // Synthesize missing parent directories
        const parts = e.entryName.replace(/\/$/, "").split("/");
        for (let i = 1; i < parts.length; i++) {
          const implicitDir = parts.slice(0, i).join("/") + "/";
          if (!knownDirs.has(implicitDir)) {
            knownDirs.add(implicitDir);
            const parent = i === 1 ? "" : parts.slice(0, i - 1).join("/") + "/";
            if (!children.has(parent)) children.set(parent, []);
            children.get(parent).push({ entryName: implicitDir, isDirectory: true, header: {}, attr: 0, _synthetic: true });
          }
        }
      });
      // Group entries by parent folder
      allEntries.forEach((e) => {
        const parent = getParent(e.entryName);
        if (!children.has(parent)) children.set(parent, []);
        children.get(parent).push(e);
      });
      // Sort each group
      for (const [, list] of children) {
        const sorted = sortEntries(list);
        list.length = 0;
        list.push(...sorted);
      }
      // Walk tree depth-first, respecting collapsed state
      const result = [];
      function walk(parentPath) {
        const list = children.get(parentPath) || [];
        list.forEach((entry) => {
          result.push(entry);
          if (entry.isDirectory && !collapsedPaths.has(entry.entryName)) {
            walk(entry.entryName);
          }
        });
      }
      walk("");
      return result;
    }

    function render() {
      buildHeader();
      const body = document.getElementById("tree-body");
      body.innerHTML = "";
      const visibleEntries = buildVisibleList();
      visibleEntries.forEach((entry, idx) => {
        const tr = document.createElement("tr");
        tr.dataset.path = entry.entryName;
        tr.draggable = !isReadOnly();
        if (selectedPaths.has(entry.entryName)) tr.classList.add("selected");
        if (entry._pending) tr.classList.add("pending");
        tr.addEventListener("dragstart", (e) => {
          if (isReadOnly()) { e.preventDefault(); return; }
          const paths = selectedPaths.has(entry.entryName) ? [...selectedPaths] : [entry.entryName];
          e.dataTransfer.setData("application/x-archivesphynx-entry", JSON.stringify(paths));
          e.dataTransfer.effectAllowed = "move";
        });
        tr.addEventListener("dragover", (e) => {
          if (isReadOnly()) return;
          if (e.dataTransfer.types.includes("application/x-archivesphynx-entry")) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            tr.classList.remove("drop-above", "drop-below", "drop-into");
            const rect = tr.getBoundingClientRect();
            const y = (e.clientY - rect.top) / rect.height;
            if (entry.isDirectory && y > 0.25 && y < 0.75) {
              tr.classList.add("drop-into");
            } else if (y < 0.5) {
              tr.classList.add("drop-above");
            } else {
              tr.classList.add("drop-below");
            }
          } else if (e.dataTransfer.types.includes("Files") && archive) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "copy";
            tr.classList.remove("drop-above", "drop-below", "drop-into");
            const rect = tr.getBoundingClientRect();
            const y = (e.clientY - rect.top) / rect.height;
            if (entry.isDirectory && y > 0.25 && y < 0.75) {
              tr.classList.add("drop-into");
            } else if (y < 0.5) {
              tr.classList.add("drop-above");
            } else {
              tr.classList.add("drop-below");
            }
          }
        });
        tr.addEventListener("dragleave", () => tr.classList.remove("drop-above", "drop-below", "drop-into"));
        tr.addEventListener("drop", async (e) => {
          tr.classList.remove("drop-above", "drop-below", "drop-into");
          if (isReadOnly()) return;
          const rect = tr.getBoundingClientRect();
          const y = (e.clientY - rect.top) / rect.height;
          const wasInto = entry.isDirectory && y > 0.25 && y < 0.75;
          const raw = e.dataTransfer.getData("application/x-archivesphynx-entry");
          if (raw) {
            e.preventDefault();
            e.stopPropagation();
            if (saving) return;
            saving = true;
            ipcRenderer.invoke("set-saving", true);
            showProgress("Moving…", true);
            updateToolbar();
            const destFolder = (wasInto && entry.isDirectory) ? entry.entryName : getParent(entry.entryName);
            await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
            try {
              JSON.parse(raw).forEach((srcPath) => moveEntry(srcPath, destFolder, true));
              refreshZip();
              selectedPaths.clear();
              setDirty(true);
            } finally {
              saving = false;
              ipcRenderer.invoke("set-saving", false);
              hideProgress();
              render();
            }
          } else if (e.dataTransfer.types.includes("Files")) {
            e.preventDefault();
            e.stopPropagation();
            if (!archive || saving) return;
            const files = [...e.dataTransfer.files];
            if (!files.length) return;
            saving = true;
            ipcRenderer.invoke("set-saving", true);
            const targetFolder = (wasInto && entry.isDirectory) ? entry.entryName : getParent(entry.entryName);
            showProgress("Adding…", true);
            updateToolbar();
            await new Promise((r) => setTimeout(r, 0));
            try {
              addCount = 0; skippedFiles = [];
              for (const file of files) {
                await addPathToZip(webUtils.getPathForFile(file), targetFolder);
              }
            } finally {
              if (addCount > 0) setDirty(true);
              saving = false;
              ipcRenderer.invoke("set-saving", false);
              hideProgress();
              render();
              showSkippedWarning();
            }
          }
        });
        let clickTimer = null;
        tr.addEventListener("click", (e) => {
          if (e.target.classList.contains("toggle")) return;
          if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
          clickTimer = setTimeout(() => {
            clickTimer = null;
            handleRowClick(entry.entryName, idx, e);
          }, 250);
        });
        tr.addEventListener("dblclick", (e) => {
          if (e.target.classList.contains("toggle")) return;
          if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
          startRename(entry, tr);
        });
        columnOrder.forEach((colId) => {
          const col = COLUMNS.find((c) => c.id === colId);
          const td = document.createElement("td");
          if (colId === "name") {
            const depth = entry.entryName.replace(/\/$/, "").split("/").length - 1;
            td.style.paddingLeft = (depth * 16 + 8) + "px";
            if (entry.isDirectory) {
              const toggle = document.createElement("span");
              toggle.classList.add("toggle");
              toggle.textContent = collapsedPaths.has(entry.entryName) ? "▶ " : "▼ ";
              toggle.addEventListener("click", (e) => {
                e.stopPropagation();
                const collapse = !collapsedPaths.has(entry.entryName);
                if (e.altKey) {
                  // Toggle all subfolders recursively
                  const allEntries = archive.getEntries();
                  allEntries.filter((en) => en.isDirectory && en.entryName.startsWith(entry.entryName))
                    .forEach((en) => { collapse ? collapsedPaths.add(en.entryName) : collapsedPaths.delete(en.entryName); });
                  pendingFiles.filter((pf) => pf.isDirectory && pf.entryName.startsWith(entry.entryName))
                    .forEach((pf) => { collapse ? collapsedPaths.add(pf.entryName) : collapsedPaths.delete(pf.entryName); });
                }
                if (collapse) collapsedPaths.add(entry.entryName);
                else collapsedPaths.delete(entry.entryName);
                render();
              });
              td.appendChild(toggle);
            } else {
              const spacer = document.createElement("span");
              spacer.className = "toggle-spacer";
              td.appendChild(spacer);
            }
            const icon = document.createTextNode(entry.isDirectory ? "📁 " : "📄 ");
            td.appendChild(icon);
            td.appendChild(document.createTextNode(path.basename(entry.entryName.replace(/\/$/, ""))));
          } else {
            td.textContent = col.getter(entry);
          }
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      updateStatus();
    }

    function handleRowClick(entryPath, idx, e) {
      if (e.metaKey || e.ctrlKey) {
        if (selectedPaths.has(entryPath)) selectedPaths.delete(entryPath);
        else selectedPaths.add(entryPath);
      } else if (e.shiftKey && lastClickedIdx >= 0) {
        const entries = buildVisibleList();
        const start = Math.min(lastClickedIdx, idx);
        const end = Math.max(lastClickedIdx, idx);
        for (let i = start; i <= end; i++) {
          selectedPaths.add(entries[i].entryName);
        }
      } else {
        selectedPaths.clear();
        selectedPaths.add(entryPath);
      }
      lastClickedIdx = idx;
      render();
    }

    function getSelectedFolder() {
      if (selectedPaths.size === 0) return "";
      const first = [...selectedPaths][0];
      if (first.endsWith("/")) return first;
      const parts = first.split("/");
      parts.pop();
      return parts.length ? parts.join("/") + "/" : "";
    }

    function moveEntry(srcPath, destFolder, batch) {
      if (!archive) return;
      if (!batch && saving) return;
      if (srcPath === destFolder) return;
      if (destFolder.startsWith(srcPath)) return;
      if (getParent(srcPath) === destFolder) return;
      const baseName = path.basename(srcPath.replace(/\/$/, ""));
      const isDir = srcPath.endsWith("/");
      const srcParent = getParent(srcPath);
      const newPath = destFolder + baseName + (isDir ? "/" : "");
      const altPath = isDir ? newPath.slice(0, -1) : newPath + "/";
      if (archive.getEntry(newPath) || archive.getEntry(altPath) || pendingFiles.some((pf) => pf.entryName === newPath || pf.entryName === altPath)) {
        ipcRenderer.invoke("show-message", { type: "warning", title: "Cannot Move", message: "An item named \"" + baseName + "\" already exists in the destination folder." });
        return;
      }
      const newNorm = newPath.replace(/\/$/, "").toLowerCase();
      if (archive.getEntries().some((e) => e.entryName !== srcPath && e.entryName.replace(/\/$/, "").toLowerCase() === newNorm)
        || pendingFiles.some((pf) => pf.entryName !== srcPath && pf.entryName.replace(/\/$/, "").toLowerCase() === newNorm)) {
        ipcRenderer.invoke("show-message", { type: "warning", title: "Case Conflict", message: "An item with a similar name differing only in case already exists.\nThis may cause issues when extracting on case-insensitive filesystems (macOS, Windows)." });
      }
      archive.renameEntry(srcPath, newPath);
      pendingFiles.forEach((pf) => {
        if (pf.entryName === srcPath) pf.entryName = newPath;
        else if (isDir && pf.entryName.startsWith(srcPath)) pf.entryName = newPath + pf.entryName.slice(srcPath.length);
      });
      // Move matching __MACOSX entries
      if (isDir) {
        const macSrc = "__MACOSX/" + srcPath;
        const macDest = "__MACOSX/" + destFolder + baseName + "/";
        archive.renameEntry(macSrc, macDest);
      }
      const forkSrc = "__MACOSX/" + srcParent + "._" + baseName;
      const forkDest = "__MACOSX/" + destFolder + "._" + baseName;
      if (archive.getEntry(forkSrc)) archive.renameEntry(forkSrc, forkDest);
      if (!batch) {
        refreshZip();
        selectedPaths.clear();
        setDirty(true);
        render();
      }
    }

    function startRename(entry, tr) {      if (!archive || saving) return;
      const nameColIdx = columnOrder.indexOf("name");
      if (nameColIdx < 0) return;
      const td = tr.children[nameColIdx];
      const oldName = path.basename(entry.entryName.replace(/\/$/, ""));
      tr.draggable = false;
      const input = document.createElement("input");
      input.type = "text";
      input.value = oldName;
      input.className = "rename-input";
      td.textContent = "";
      td.appendChild(input);
      input.focus();
      input.select();

      let committed = false;
      const commit = async () => {
        if (committed) return;
        committed = true;
        const newName = input.value.trim();
        if (newName && newName !== oldName) {
          const parent = getParent(entry.entryName);
          const oldPath = entry.entryName;
          const isDir = entry.isDirectory;
          const newPath = parent + newName + (isDir ? "/" : "");
          // Revert if an entry with that name already exists (check both file and folder forms)
          const altPath = isDir ? newPath.slice(0, -1) : newPath + "/";
          if (newPath !== oldPath && (archive.getEntry(newPath) || archive.getEntry(altPath) || pendingFiles.some((pf) => pf.entryName === newPath || pf.entryName === altPath))) { render(); return; }
          // Warn on case-only collision (normalize trailing slash for cross-type comparison)
          const newNorm = newPath.replace(/\/$/, "").toLowerCase();
          const caseCollision = archive.getEntries().some((e) => e.entryName !== oldPath && e.entryName.replace(/\/$/, "").toLowerCase() === newNorm)
            || pendingFiles.some((pf) => pf.entryName !== oldPath && pf.entryName.replace(/\/$/, "").toLowerCase() === newNorm);
          if (caseCollision) {
            ipcRenderer.invoke("show-message", { type: "warning", title: "Case Conflict", message: "An item with a similar name differing only in case already exists.\nThis may cause issues when extracting on case-insensitive filesystems (macOS, Windows)." });
          }
          archive.renameEntry(oldPath, newPath);
          pendingFiles.forEach((pf) => {
            if (pf.entryName === oldPath) pf.entryName = newPath;
            else if (isDir && pf.entryName.startsWith(oldPath)) pf.entryName = newPath + pf.entryName.slice(oldPath.length);
          });
          selectedPaths.delete(oldPath);
          selectedPaths.add(newPath);
          refreshZip();
          setDirty(true);
        }
        render();
      };

      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") { input.value = oldName; input.blur(); }
      });
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("mousedown", (e) => e.stopPropagation());
      input.addEventListener("dblclick", (e) => e.stopPropagation());
    }

          } else if (archive.format === "tar") {
            archive.entries.push({
              entryName: pf.entryName,
              isDirectory: false,

              time: new Date(),
              mode: 0o644,
              data: null,

              filePath: pf.fsPath,
            });
          } else {
            archive.addFile(pf.entryName, fs.readFileSync(pf.fsPath));

          if ((i + 1) % 20 === 0 || i === total - 1) {

            await new Promise((r) => setTimeout(r, 0));
          }
        }
        pendingFiles = [];
        updateProgressLabel("Compressing…");
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        await saveZip();
        setDirty(false);

          ipcRenderer.invoke("show-message", { type: "warning", title: "Performance Warning", message: "Bzip2 CLI not found. Using slower JavaScript fallback.\nInstall bzip2 and configure its path in Settings for better performance." });

    async function saveArchiveAs() {
      if (!archive) return;
      const result = await ipcRenderer.invoke("dialog-save", {
        title: "Save Archive As",
        filters: getSaveFilters(),
      });
      if (!result) return;
      const newArchiveObj = createArchive(result);
      if (!newArchiveObj) {
        ipcRenderer.invoke("show-message", { type: "error", title: "Save Failed", message: "Unsupported archive format for: " + result });
        return;
      }
      saving = true;
      ipcRenderer.invoke("set-saving", true);
      showProgress("Saving…", true);
      updateToolbar();
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      newArchiveObj.create();
      // Copy entries to new archive
      const copySkipped = [];
      if (archive.format === "tar" && newArchiveObj.format === "tar") {
        // TAR→TAR: transfer source references directly (no memory copy)
        for (const entry of archive.entries) {
          newArchiveObj.entries.push({ ...entry });
        }
        for (const pf of pendingFiles) {
          if (pf.isDirectory) newArchiveObj.addFile(pf.entryName, Buffer.alloc(0));
          else newArchiveObj.addFile(pf.entryName, fs.readFileSync(pf.fsPath));
        }
        pendingFiles = [];
      } else if (newArchiveObj.format === "7z") {
        // 7z: extract source to temp dir, then archive directly (avoids memory buffering)
        const os = require("os");
        const tempDir = path.join(os.tmpdir(), "archivesphynx-saveas-" + Date.now());
        fs.mkdirSync(tempDir, { recursive: true });
        try {
          updateProgressLabel("Extracting…");
          await new Promise((r) => setTimeout(r, 0));
          await archive.extractAll(tempDir, updateProgress);
          for (const pf of pendingFiles) {
            const dest = path.join(tempDir, pf.entryName);
            if (pf.isDirectory) fs.mkdirSync(dest, { recursive: true });
            else { fs.mkdirSync(path.dirname(dest), { recursive: true }); fs.copyFileSync(pf.fsPath, dest); }
          }
          pendingFiles = [];
          updateProgressLabel("Compressing…");
          await new Promise((r) => setTimeout(r, 0));
          if (fs.existsSync(result)) fs.unlinkSync(result);
          const { spawn } = require("child_process");
          const { getSevenZipPath } = require("./archive");
          await new Promise((resolve, reject) => {
            const proc = spawn(getSevenZipPath(), ["a", "-t7z", result, path.join(tempDir, "*")], { stdio: ["ignore", "pipe", "pipe"] });
            proc.on("close", (code) => code === 0 ? resolve() : reject(new Error("7z compression failed")));
            proc.on("error", reject);
          });
        } finally {
          fs.rmSync(tempDir, { recursive: true, force: true });
        }
        updateProgressLabel("Reloading…");
        await new Promise((r) => setTimeout(r, 0));
        ipcRenderer.invoke("unregister-open-file", archivePath);
        archivePath = result;
        archive = newArchiveObj;
        await archive.open(archivePath, updateProgress);
        collapseAll();
        saving = false;
        ipcRenderer.invoke("set-saving", false);
        hideProgress();
        ipcRenderer.invoke("register-open-file", archivePath);
        setDirty(false);
        updatePathBar();
        render();
        return;
      } else {
        const allEntries = archive.getEntries();
        const total = allEntries.length;
        const isTarTarget = newArchiveObj.format === "tar";
        let tempDataFile = null;
        if (isTarTarget && archive._sourceFile) {
          // Stream entries from ZIP to a single temp data file, record offsets
          tempDataFile = path.join(require("os").tmpdir(), "archivesphynx-saveas-" + Date.now() + ".dat");
          newArchiveObj._tempDataFile = tempDataFile;
          const yauzl = require("yauzl");
          let entryIdx = 0;
          const datFd = fs.openSync(tempDataFile, "w");
          fs.closeSync(datFd);
          const datWs = fs.createWriteStream(tempDataFile);
          let dataOffset = 0;
          await new Promise((resolve, reject) => {
            yauzl.open(archive._sourceFile, { lazyEntries: true, autoClose: true }, (err, zipfile) => {
              if (err) { datWs.close(); return reject(err); }
              zipfile.readEntry();
              zipfile.on("entry", (ze) => {
                entryIdx++;
                if (entryIdx % 50 === 0) updateProgress(entryIdx, zipfile.entryCount);
                if (ze.fileName.endsWith("/")) {
                  newArchiveObj.addFile(ze.fileName, Buffer.alloc(0));
                  zipfile.readEntry();
                } else {
                  zipfile.openReadStream(ze, (err2, stream) => {
                    if (err2) { copySkipped.push(ze.fileName + " (" + err2.message + ")"); zipfile.readEntry(); return; }
                    const entryOffset = dataOffset;
                    let entrySize = 0;
                    const onDrain = () => stream.resume();
                    stream.on("data", (chunk) => {
                      entrySize += chunk.length;
                      dataOffset += chunk.length;
                      if (!datWs.write(chunk)) {
                        stream.pause();
                        datWs.once("drain", onDrain);
                      }
                    });
                    stream.on("end", () => {
                      datWs.removeListener("drain", onDrain);
                      newArchiveObj.entries.push({
                        entryName: ze.fileName, isDirectory: false, size: entrySize,
                        time: ze.getLastModDate(),
                        mode: (ze.externalFileAttributes >>> 16) || 0o644,
                        data: null, sourceFile: tempDataFile, offset: entryOffset, filePath: null,
                      });
                      zipfile.readEntry();
                    });
                    stream.on("error", (e) => { copySkipped.push(ze.fileName + " (" + e.message + ")"); zipfile.readEntry(); });
                  });
                }
              });
              zipfile.on("end", () => { datWs.end(); });
              zipfile.on("error", (e) => { datWs.close(); reject(e); });
            });
            datWs.on("finish", resolve);
            datWs.on("error", reject);
          });
          updateProgress(total, total);
        } else {
          // Non-TAR target or no source file: use in-memory copy
          const total = allEntries.length;
          for (let i = 0; i < total; i++) {
            const entry = allEntries[i];
            if (entry.isDirectory) {
              newArchiveObj.addFile(entry.entryName, Buffer.alloc(0));
            } else if (entry.size > 2 * 1024 * 1024 * 1024) {
              copySkipped.push(entry.entryName + " (" + formatBytes(entry.size) + ")");
            } else {
              try {
                const data = archive.getData(entry.entryName);
                if (data) newArchiveObj.addFile(entry.entryName, data);
                else copySkipped.push(entry.entryName + " (no data)");
              } catch (err) {
                if (err.message && err.message.includes("allocate memory")) {
                  ipcRenderer.invoke("show-message", { type: "error", title: "Save Failed", message: "Ran out of memory while copying entries.\nThe archive is too large for " + newArchiveObj.format.toUpperCase() + " format.\nUse a TAR-based format instead." });
                  saving = false;
                  ipcRenderer.invoke("set-saving", false);
                  hideProgress();
                  render();
                  return;
                }
                copySkipped.push(entry.entryName + " (" + err.message + ")");
              }
            }
            if ((i + 1) % 50 === 0 || i === total - 1) {
              updateProgress(i + 1, total);
              await new Promise((r) => setTimeout(r, 0));
            }
          }
        }
      }
      if (copySkipped.length > 0) {
        ipcRenderer.invoke("show-message", { type: "warning", title: "Files Skipped", message: "The following files could not be copied:\n\n" + copySkipped.join("\n") });
      }
      ipcRenderer.invoke("unregister-open-file", archivePath);
      archivePath = result;
      archive = newArchiveObj;
      for (const pf of pendingFiles) {
        if (pf.isDirectory) archive.addFile(pf.entryName, Buffer.alloc(0));
        else archive.addFile(pf.entryName, fs.readFileSync(pf.fsPath));
      }
      pendingFiles = [];
      updateProgressLabel("Compressing…");
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      try {
        await saveZip();
      } catch (err) {
        ipcRenderer.invoke("show-message", { type: "error", title: "Save Failed", message: err.message });
      }
      if (archive._tempDataFile) { try { fs.unlinkSync(archive._tempDataFile); } catch {} }
      saving = false;
      ipcRenderer.invoke("set-saving", false);
      hideProgress();
      ipcRenderer.invoke("register-open-file", archivePath);
      setDirty(false);
      updatePathBar();
      render();
    }

    async function cleanMacOS() {
      if (!archive || saving) return;
      const isMacJunk = (entryName) => {
        const name = path.basename(entryName.replace(/\/$/, ""));
        return entryName.startsWith("__MACOSX/") || entryName === "__MACOSX/" || name === ".DS_Store" || name.startsWith("._");
      };
      const toDelete = archive.getEntries()
        .filter((e) => isMacJunk(e.entryName))
        .map((e) => e.entryName);
      const pendingBefore = pendingFiles.length;
      pendingFiles = pendingFiles.filter((pf) => !isMacJunk(pf.entryName));
      if (toDelete.length === 0 && pendingFiles.length === pendingBefore) return;
      saving = true;
      ipcRenderer.invoke("set-saving", true);
      showProgress("Cleaning…", true);
      updateToolbar();
      await new Promise((r) => setTimeout(r, 0));
      try {
        for (let i = 0; i < toDelete.length; i++) {
          archive.deleteFile(toDelete[i]);
          if (i % 100 === 0) {
            updateProgress(i + 1, toDelete.length);
            await new Promise((r) => setTimeout(r, 0));
          }
        }
        await pruneEmptyDirs();
        refreshZip();
        selectedPaths.clear();
        setDirty(true);
      } finally {
        saving = false;
        ipcRenderer.invoke("set-saving", false);
        hideProgress();
        render();
      }
    }

      if (raw) {
        e.preventDefault();
        if (saving) return;
        saving = true;
        ipcRenderer.invoke("set-saving", true);
        showProgress("Moving…", true);
        updateToolbar();
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        try {
          JSON.parse(raw).forEach((srcPath) => moveEntry(srcPath, "", true));
          refreshZip();
          selectedPaths.clear();
          setDirty(true);
        } finally {
          saving = false;
          ipcRenderer.invoke("set-saving", false);
          hideProgress();
          render();
        }
        return;
      }
      if (e.dataTransfer.types.includes("application/x-archivesphynx-entry")) return;
      e.preventDefault();
      if (!archive || saving) return;
      const files = [...e.dataTransfer.files];
      if (!files.length) return;
      // Determine target folder from drop target row
      let targetFolder = "";
      const row = e.target.closest("tr[data-path]");
      if (row) {
        const rect = row.getBoundingClientRect();
        const y = (e.clientY - rect.top) / rect.height;
        const rowPath = row.dataset.path;
        if (rowPath.endsWith("/") && y > 0.25 && y < 0.75) {
          targetFolder = rowPath;
        } else {
          const parts = rowPath.replace(/\/$/, "").split("/");
          parts.pop();
          targetFolder = parts.length ? parts.join("/") + "/" : "";
        }
      }
      saving = true;
      ipcRenderer.invoke("set-saving", true);
      showProgress("Adding…", true);
      updateToolbar();
      await new Promise((r) => setTimeout(r, 0));
      try {
        addCount = 0; skippedFiles = [];
        for (const file of files) {
          await addPathToZip(webUtils.getPathForFile(file), targetFolder);
        }
      } finally {
        if (addCount > 0) setDirty(true);
        saving = false;
        ipcRenderer.invoke("set-saving", false);
        hideProgress();
        render();
        showSkippedWarning();
      }
    });

    const MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024; // 2GB Buffer limit
    let addCount = 0;
    let skippedFiles = [];
    function showSkippedWarning() {
      if (skippedFiles.length > 0) {
        ipcRenderer.invoke("show-skipped-files", skippedFiles.join("\n"));
        skippedFiles = [];
      }
    }
    function entryExists(entryName) {
      const alt = entryName.endsWith("/") ? entryName.slice(0, -1) : entryName + "/";
      return !!(archive.getEntry(entryName) || archive.getEntry(alt)
        || pendingFiles.some((pf) => pf.entryName === entryName || pf.entryName === alt));
    }
    async function addPathToZip(fsPath, targetFolder) {
      const stat = fs.statSync(fsPath);
      const name = path.basename(fsPath);
      if (stat.isDirectory()) {
        const folderPath = targetFolder + name + "/";
        if (!entryExists(folderPath)) {
          pendingFiles.push({ entryName: folderPath, fsPath, isDirectory: true, size: 0 });
          collapsedPaths.add(folderPath);
        }
        const children = fs.readdirSync(fsPath);
        for (const child of children) {
          await addPathToZip(path.join(fsPath, child), folderPath);
        }
      } else if (stat.size > MAX_FILE_SIZE) {
        skippedFiles.push(fsPath + " (" + formatBytes(stat.size) + ")");
      } else {
        const entryName = targetFolder + name;
        if (entryExists(entryName)) {
          skippedFiles.push(fsPath + " (duplicate name)");
        } else {
          pendingFiles.push({ entryName, fsPath, isDirectory: false, size: stat.size });
          addCount++;
          if (addCount % 200 === 0) {
            updateProgress(addCount, 0);
            await new Promise((r) => setTimeout(r, 0));
          }
        }
      }
    }

    // Open archive from dock drag (macOS)
    ipcRenderer.on("open-archive-path", async (_e, filePath) => {
      archivePath = filePath;
      archive = createArchive(archivePath);
      pendingFiles = [];
      saving = true;
      ipcRenderer.invoke("set-saving", true);
      showProgress("Loading…", true);
      updateToolbar();
      try {
        await archive.open(archivePath, updateProgress);
      } catch (err) {
        hideProgress();
        saving = false;
        ipcRenderer.invoke("set-saving", false);
        archive = null;
        archivePath = "";
        ipcRenderer.invoke("show-message", { type: "error", title: "Cannot Open Archive", message: err.message });
        render();
        return;
      }
      saving = false;
      ipcRenderer.invoke("set-saving", false);
      hideProgress();
      if (wasBzip2FallbackUsed()) {
        ipcRenderer.invoke("show-message", { type: "warning", title: "Performance Warning", message: "Bzip2 CLI not found. Using slower JavaScript fallback.\nInstall bzip2 and configure its path in Settings for better performance." });
      }
      collapseAll();
      selectedPaths.clear();
      ipcRenderer.invoke("register-open-file", archivePath);
      setDirty(false);
      updatePathBar();
      render();
    });

    ipcRenderer.on("new-archive-path", async (_e, filePath) => {
      archivePath = filePath;
      archive = createArchive(archivePath);
      pendingFiles = [];
      archive.create();
      await saveZip();
      selectedPaths.clear();
      ipcRenderer.invoke("register-open-file", archivePath);
      setDirty(false);
      updatePathBar();
      render();
    });

    // Button handlers
    document.getElementById("btn-new").addEventListener("click", newArchive);
    document.getElementById("btn-open").addEventListener("click", openArchive);
    document.getElementById("btn-save").addEventListener("click", saveArchive);
    document.getElementById("btn-saveas").addEventListener("click", saveArchiveAs);
    document.getElementById("btn-add").addEventListener("click", addFiles);
    document.getElementById("btn-folder").addEventListener("click", newFolder);
    document.getElementById("btn-delete").addEventListener("click", deleteSelected);
    document.getElementById("btn-extract").addEventListener("click", extractSelected);
    document.getElementById("btn-test").addEventListener("click", testIntegrity);
    document.getElementById("btn-clean").addEventListener("click", cleanMacOS);

    // IPC from menu
    ipcRenderer.on("menu-new", newArchive);
    ipcRenderer.on("menu-open", openArchive);
    ipcRenderer.on("menu-save", saveArchive);
    ipcRenderer.on("menu-saveas", saveArchiveAs);
    ipcRenderer.on("menu-add", addFiles);
    ipcRenderer.on("menu-new-folder", newFolder);
    ipcRenderer.on("menu-delete", deleteSelected);
    ipcRenderer.on("menu-extract", extractSelected);
    ipcRenderer.on("menu-test", testIntegrity);
    ipcRenderer.on("menu-clean", cleanMacOS);
    ipcRenderer.on("settings-updated", async () => {
      await loadColumnOrder();
      render();
    });

    ipcRenderer.on("tar-save-progress", (_e, current, total) => {
      updateProgress(current, total);
    });

    ipcRenderer.on("request-save", async () => {
      await saveArchive();
    });

    window.addEventListener("unhandledrejection", (e) => {
      const msg = e.reason?.message || String(e.reason);
      ipcRenderer.invoke("show-message", { type: "error", title: "Unexpected Error", message: msg });
      if (saving) { saving = false; ipcRenderer.invoke("set-saving", false); hideProgress(); render(); }
    });

    // Init
    loadColumnOrder().then(() => render());
  </script>
</body>
</html>
