name: Build and Release C++ macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v2.0.0)"
        required: true

jobs:
  build-cpp-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Install Qt6 and libarchive
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # Install x86_64 Homebrew and libraries for cross-compilation
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            arch -x86_64 /usr/local/bin/brew install qt@6 libarchive cmake ninja
          else
            brew install qt@6 libarchive cmake ninja
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $RUNNER_TEMP/build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $RUNNER_TEMP/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain

      - name: Inject license salt
        run: |
          cat > cpp/src/License.cpp << EOF
          #include "License.h"

          const QByteArray LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          EOF

      - name: Update version in CMakeLists.txt
        run: sed -i '' "s/project(ArchiveSphynx VERSION [0-9.]*/project(ArchiveSphynx VERSION ${{ steps.version.outputs.version }}/" cpp/CMakeLists.txt

      - name: Configure and build
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            QT_PREFIX="/usr/local/opt/qt@6"
            ARCHIVE_PREFIX="/usr/local/opt/libarchive"
          else
            QT_PREFIX="$(brew --prefix qt@6)"
            ARCHIVE_PREFIX="$(brew --prefix libarchive)"
          fi
          CMAKE_ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          cmake -S cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${CMAKE_ARCH} \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX};${ARCHIVE_PREFIX}"
          cmake --build build

      - name: Deploy, sign, and create DMG
        env:
          APPLE_TEAM_ID: MMZ3Y97NTP
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            MACDEPLOYQT="/usr/local/opt/qt@6/bin/macdeployqt"
          else
            MACDEPLOYQT="$(brew --prefix qt@6)/bin/macdeployqt"
          fi
          ARCH=${{ matrix.arch }}
          VERSION=${{ steps.version.outputs.version }}
          IDENTITY="Developer ID Application: Richard Lesh (${APPLE_TEAM_ID})"

          # Deploy Qt frameworks (skip plugins with unresolvable dependencies)
          "$MACDEPLOYQT" build/ArchiveSphynx.app \
            -always-overwrite \
            -no-strip

          # Remove plugins that reference unavailable Qt modules
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/virtualkeyboard
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/imageformats/libqpdf.dylib
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/imageformats/libqsvg.dylib
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/imageformats/libqwebp.dylib

          # Sign all bundled libraries and frameworks with hardened runtime
          find build/ArchiveSphynx.app/Contents/Frameworks -type f \( -name "*.dylib" -o -perm +111 \) | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "$f" 2>/dev/null || true
          done
          find build/ArchiveSphynx.app/Contents/PlugIns -type f -name "*.dylib" | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "$f" 2>/dev/null || true
          done
          codesign --force --deep --options runtime --sign "$IDENTITY" --timestamp build/ArchiveSphynx.app

          # Create DMG
          mkdir -p dist
          hdiutil create -volname "ArchiveSphynx" \
            -srcfolder build/ArchiveSphynx.app \
            -ov -format UDZO \
            "dist/ArchiveSphynx-${VERSION}-${ARCH}.dmg"
          codesign --force --sign "$IDENTITY" "dist/ArchiveSphynx-${VERSION}-${ARCH}.dmg"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY" > "$KEY_FILE"
          xcrun notarytool submit dist/*.dmg \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple dist/*.dmg

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} \
            dist/*.dmg --clobber
