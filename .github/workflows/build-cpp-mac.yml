name: Build and Release C++ macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. 2.2.0)"
        required: true

jobs:
  build-cpp-mac:
    # Each architecture builds natively on its own runner — macos-latest is now
    # Apple Silicon, and Homebrew refuses to install the Intel prefix under
    # Rosetta there ("only supported on Apple Silicon processors"), so the old
    # `arch -x86_64` cross-build no longer works. arm64 builds on Apple Silicon;
    # x64 builds on the Intel image (macos-15-intel, available until Aug 2027).
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Install Qt6 and libarchive
        run: |
          # Native Homebrew on each runner (Intel prefix /usr/local on
          # macos-15-intel, /opt/homebrew on Apple Silicon). No Rosetta.
          brew install qt@6 libarchive cmake ninja

      - name: Import Developer ID certificate
        id: cert
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $RUNNER_TEMP/build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $RUNNER_TEMP/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain

          # Extract signing identity hash
          IDENTITY_HASH=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain | head -1 | awk '{print $2}')
          echo "hash=$IDENTITY_HASH" >> $GITHUB_OUTPUT
          echo "Found identity: $IDENTITY_HASH"

      - name: Inject license salt
        run: |
          cat > cpp/src/License.cpp << EOF
          #include "License.h"

          const QByteArray LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          EOF

      - name: Update version in CMakeLists.txt
        run: sed -i '' "s/project(ArchiveSphynx VERSION [0-9.]*/project(ArchiveSphynx VERSION ${{ steps.version.outputs.version }}/" cpp/CMakeLists.txt

      - name: Configure and build
        run: |
          # Native Homebrew prefix on each runner resolves correctly for both
          # /usr/local (Intel) and /opt/homebrew (Apple Silicon).
          QT_PREFIX="$(brew --prefix qt@6)"
          ARCHIVE_PREFIX="$(brew --prefix libarchive)"
          CMAKE_ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
          cmake -S cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${CMAKE_ARCH} \
            -DCMAKE_PREFIX_PATH="${QT_PREFIX};${ARCHIVE_PREFIX}"
          cmake --build build

      - name: Deploy, sign, and create DMG
        env:
          APPLE_TEAM_ID: MMZ3Y97NTP
          IDENTITY: ${{ steps.cert.outputs.hash }}
        run: |
          MACDEPLOYQT="$(brew --prefix qt@6)/bin/macdeployqt"
          ARCH=${{ matrix.arch }}
          VERSION=${{ steps.version.outputs.version }}

          # Deploy Qt frameworks (skip plugins with unresolvable dependencies)
          "$MACDEPLOYQT" build/ArchiveSphynx.app \
            -always-overwrite \
            -no-strip

          # Remove plugins that reference unavailable Qt modules
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/virtualkeyboard
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/imageformats/libqpdf.dylib
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/imageformats/libqsvg.dylib
          rm -rf build/ArchiveSphynx.app/Contents/PlugIns/imageformats/libqwebp.dylib

          # Sign all bundled libraries and frameworks with hardened runtime
          find build/ArchiveSphynx.app/Contents/Frameworks -type f \( -name "*.dylib" -o -perm +111 \) | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "$f" 2>/dev/null || true
          done
          find build/ArchiveSphynx.app/Contents/PlugIns -type f -name "*.dylib" | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "$f" 2>/dev/null || true
          done
          codesign --force --deep --options runtime --sign "$IDENTITY" --timestamp build/ArchiveSphynx.app

          # Stage DMG contents
          mkdir -p dist dmg_stage
          cp -R build/ArchiveSphynx.app dmg_stage/
          ln -s /Applications dmg_stage/Applications

          # Create read-write DMG
          hdiutil create -volname "ArchiveSphynx" \
            -srcfolder dmg_stage \
            -ov -format UDRW \
            "dist/ArchiveSphynx-rw.dmg"

          # Mount and customize
          hdiutil attach "dist/ArchiveSphynx-rw.dmg" -mountpoint /Volumes/ArchiveSphynx
          cp cpp/resources/icons/app_icon.icns /Volumes/ArchiveSphynx/.VolumeIcon.icns
          SetFile -a C /Volumes/ArchiveSphynx

          # Set Finder window layout
          osascript <<'EOF'
          tell application "Finder"
            tell disk "ArchiveSphynx"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {100, 100, 640, 400}
              set theViewOptions to icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 80
              set position of item "ArchiveSphynx.app" of container window to {130, 150}
              set position of item "Applications" of container window to {410, 150}
              close
            end tell
          end tell
          EOF

          hdiutil detach /Volumes/ArchiveSphynx

          # Convert to compressed format
          hdiutil convert "dist/ArchiveSphynx-rw.dmg" \
            -format UDZO -o "dist/ArchiveSphynx-${VERSION}-${ARCH}.dmg"
          rm "dist/ArchiveSphynx-rw.dmg"
          codesign --force --sign "$IDENTITY" "dist/ArchiveSphynx-${VERSION}-${ARCH}.dmg"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY" > "$KEY_FILE"
          xcrun notarytool submit dist/*.dmg \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple dist/*.dmg

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.event.inputs.tag }} >/dev/null 2>&1 || \
            gh release create ${{ github.event.inputs.tag }} \
              --title "ArchiveSphynx ${{ steps.version.outputs.version }}" \
              --draft=false

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} \
            dist/*.dmg --clobber
