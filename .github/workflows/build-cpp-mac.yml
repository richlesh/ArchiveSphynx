name: Build and Release C++ macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v2.0.0)"
        required: true

jobs:
  build-cpp-mac:
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-latest' || 'macos-13' }}
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Install Qt6 and libarchive
        run: brew install qt@6 libarchive cmake ninja

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=build-keychain-password
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Inject license salt
        run: |
          cat > cpp/src/License.cpp << EOF
          #include "License.h"

          const QByteArray LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          EOF

      - name: Update version in CMakeLists.txt
        run: sed -i '' "s/project(ArchiveSphynx VERSION [0-9.]*/project(ArchiveSphynx VERSION ${{ steps.version.outputs.version }}/" cpp/CMakeLists.txt

      - name: Configure and build
        run: |
          cmake -S cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix libarchive)"
          cmake --build build

      - name: Sign application
        env:
          APPLE_TEAM_ID: MMZ3Y97NTP
        run: |
          codesign --force --deep --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            --sign "Developer ID Application: Richard Lesh (${APPLE_TEAM_ID})" \
            build/ArchiveSphynx.app

      - name: Create DMG
        run: |
          ARCH=${{ matrix.arch }}
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist
          hdiutil create -volname "ArchiveSphynx" \
            -srcfolder build/ArchiveSphynx.app \
            -ov -format UDZO \
            "dist/ArchiveSphynx-${VERSION}-${ARCH}.dmg"

      - name: Sign DMG
        env:
          APPLE_TEAM_ID: MMZ3Y97NTP
        run: |
          codesign --force \
            --keychain "$KEYCHAIN_PATH" \
            --sign "Developer ID Application: Richard Lesh (${APPLE_TEAM_ID})" \
            dist/*.dmg

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "$APPLE_API_KEY" > "$KEY_FILE"
          xcrun notarytool submit dist/*.dmg \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple dist/*.dmg

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} \
            dist/*.dmg --clobber
