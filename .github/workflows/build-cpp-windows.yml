name: Build and Release C++ Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. 2.2.0)"
        required: true

jobs:
  build-cpp-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: write
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          $ver = "${{ github.event.inputs.tag }}" -replace '^v', ''
          echo "version=$ver" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch == 'arm64' && 'win64_msvc2022_arm64_cross_compiled' || 'win64_msvc2022_64' }}
          cache: true

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('cpp/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ matrix.arch }}-

      - name: Install libarchive via vcpkg
        run: vcpkg install libarchive:${{ matrix.arch == 'arm64' && 'arm64-windows' || 'x64-windows' }}

      - name: Inject license salt
        run: |
          @"
          #include "License.h"

          const QByteArray LICENSE_SALT = "${{ secrets.LICENSE_SALT }}";
          "@ | Set-Content cpp/src/License.cpp
        shell: powershell

      - name: Update version in CMakeLists.txt
        run: |
          (Get-Content cpp/CMakeLists.txt) -replace 'project\(ArchiveSphynx VERSION [0-9.]+', "project(ArchiveSphynx VERSION ${{ steps.version.outputs.version }}" | Set-Content cpp/CMakeLists.txt
        shell: powershell

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}

      - name: Configure and Build
        shell: pwsh
        run: |
          # Resolve vcpkg root - prefer VCPKG_INSTALLATION_ROOT, fall back to C:\vcpkg (GitHub runner default)
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          Write-Host "Using vcpkg at: $vcpkgRoot"

          if (-not (Test-Path "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake")) {
            Write-Error "vcpkg toolchain not found at $vcpkgRoot/scripts/buildsystems/vcpkg.cmake"
            exit 1
          }

          # Resolve Qt prefix path (use forward slashes to avoid CMake escape issues)
          $qtPrefix = if ($env:Qt6_DIR) { "$env:Qt6_DIR/.." } else { "$env:QT_ROOT_DIR" }
          $qtPrefix = $qtPrefix -replace '\\', '/'
          Write-Host "Using Qt at: $qtPrefix"

          $vcpkgToolchain = "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" -replace '\\', '/'

          $cmakeArgs = @(
            "-S", "cpp",
            "-B", "build",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=cl",
            "-DCMAKE_CXX_COMPILER=cl",
            "-DCMAKE_PREFIX_PATH=$qtPrefix",
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.arch == 'arm64' && 'arm64-windows' || 'x64-windows' }}"
          )

          # For ARM64 cross-compilation, set the system processor and Qt host path
          if ("${{ matrix.arch }}" -eq "arm64") {
            $qtHostPath = $env:QT_HOST_PATH -replace '\\', '/'
            $cmakeArgs += "-DCMAKE_SYSTEM_PROCESSOR=ARM64"
            $cmakeArgs += "-DQT_HOST_PATH=$qtHostPath"
          }

          cmake @cmakeArgs

          # Build the project
          cmake --build build --config Release

      - name: Deploy Qt dependencies
        if: matrix.arch == 'x64'
        run: windeployqt build/ArchiveSphynx.exe
        shell: cmd

      - name: Deploy Qt dependencies (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          # windeployqt from cross-compiled Qt can't run on x64, copy DLLs manually
          $qtRoot = "$env:QT_ROOT_DIR"
          Copy-Item "$qtRoot/bin/Qt6Core.dll" build/
          Copy-Item "$qtRoot/bin/Qt6Gui.dll" build/
          Copy-Item "$qtRoot/bin/Qt6Widgets.dll" build/
          Copy-Item "$qtRoot/plugins/platforms" build/platforms -Recurse
          Copy-Item "$qtRoot/plugins/styles" build/styles -Recurse -ErrorAction SilentlyContinue
        shell: powershell

      - name: Stage build artifacts
        run: |
          New-Item -ItemType Directory -Path staging -Force
          # Copy the executable
          Copy-Item build/ArchiveSphynx.exe staging/
          # Copy all DLLs and plugins deployed by windeployqt or manually
          Get-ChildItem build -Filter *.dll | Copy-Item -Destination staging/
          if (Test-Path build/platforms) { Copy-Item build/platforms staging/platforms -Recurse }
          if (Test-Path build/styles) { Copy-Item build/styles staging/styles -Recurse }
          if (Test-Path build/imageformats) { Copy-Item build/imageformats staging/imageformats -Recurse }
          if (Test-Path build/iconengines) { Copy-Item build/iconengines staging/iconengines -Recurse }
          if (Test-Path build/tls) { Copy-Item build/tls staging/tls -Recurse }
          if (Test-Path build/translations) { Copy-Item build/translations staging/translations -Recurse }
        shell: powershell

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: powershell

      - name: Bundle MSVC runtime
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $redistDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          Copy-Item "$redistDir\vcruntime140.dll" staging/
          Copy-Item "$redistDir\vcruntime140_1.dll" staging/ -ErrorAction SilentlyContinue
          Copy-Item "$redistDir\msvcp140.dll" staging/
          Copy-Item "$redistDir\msvcp140_1.dll" staging/ -ErrorAction SilentlyContinue
          Copy-Item "$redistDir\msvcp140_2.dll" staging/ -ErrorAction SilentlyContinue
        shell: powershell

      - name: Create installer with NSIS
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          @"
          !include "MUI2.nsh"
          Name "ArchiveSphynx ${version}"
          OutFile "dist\ArchiveSphynx-${version}-${arch}-setup.exe"
          InstallDir "`$PROGRAMFILES\ArchiveSphynx"
          RequestExecutionLevel admin

          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section
            SetOutPath "`$INSTDIR"
            File /r "staging\*.*"
            CreateShortcut "`$DESKTOP\ArchiveSphynx.lnk" "`$INSTDIR\ArchiveSphynx.exe"
            CreateDirectory "`$SMPROGRAMS\ArchiveSphynx"
            CreateShortcut "`$SMPROGRAMS\ArchiveSphynx\ArchiveSphynx.lnk" "`$INSTDIR\ArchiveSphynx.exe"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
          SectionEnd

          Section "Uninstall"
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\ArchiveSphynx.lnk"
            RMDir /r "`$SMPROGRAMS\ArchiveSphynx"
          SectionEnd
          "@ | Set-Content installer.nsi

          mkdir dist
          makensis installer.nsi
        shell: powershell

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.event.inputs.tag }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.event.inputs.tag }} `
              --title "ArchiveSphynx ${{ steps.version.outputs.version }}" `
              --draft=false
          }
        shell: powershell

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} `
            (Get-ChildItem dist\*.exe | Select-Object -ExpandProperty FullName) --clobber
        shell: powershell
